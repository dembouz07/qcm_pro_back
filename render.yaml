services:
  # Backend Laravel API
  - type: web
    name: qcm-backend
    runtime: docker
    plan: starter
    domains:
      - api.checkperformance.sn
    renderSubdomainPolicy: disabled
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_NAME
        value: Check Performance
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_TIMEZONE
        value: Africa/Dakar
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: COMMERCIAL_LAUNCH_ENABLED
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: qcm-database
          property: host
      - key: DB_PORT
        fromDatabase:
          name: qcm-database
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: qcm-database
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: qcm-database
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: qcm-database
          property: password
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: true
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_HTTP_ONLY
        value: true
      - key: SESSION_SAME_SITE
        value: lax
      - key: SESSION_COOKIE
        value: check-performance-session
      - key: SESSION_DOMAIN
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: TRUSTED_PROXIES
        sync: false
      - key: SANCTUM_TOKEN_EXPIRATION
        value: 10080
      - key: ANALYTICS_HASH_KEY
        generateValue: true
      - key: ANALYTICS_INTERNAL_EMAILS
        sync: false
      - key: ANALYTICS_METRIC_ENVIRONMENT
        value: production
      - key: ANALYTICS_TEST_STARTED_AT
        sync: false
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Check Performance

  - type: cron
    name: qcm-scheduler
    runtime: docker
    plan: starter
    schedule: "* * * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: php artisan schedule:run
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_TIMEZONE
        fromService:
          type: web
          name: qcm-backend
          envVarKey: APP_TIMEZONE
      - key: APP_KEY
        fromService:
          type: web
          name: qcm-backend
          envVarKey: APP_KEY
      - key: DB_CONNECTION
        fromService:
          type: web
          name: qcm-backend
          envVarKey: DB_CONNECTION
      - key: DB_HOST
        fromService:
          type: web
          name: qcm-backend
          envVarKey: DB_HOST
      - key: DB_PORT
        fromService:
          type: web
          name: qcm-backend
          envVarKey: DB_PORT
      - key: DB_DATABASE
        fromService:
          type: web
          name: qcm-backend
          envVarKey: DB_DATABASE
      - key: DB_USERNAME
        fromService:
          type: web
          name: qcm-backend
          envVarKey: DB_USERNAME
      - key: DB_PASSWORD
        fromService:
          type: web
          name: qcm-backend
          envVarKey: DB_PASSWORD
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SANCTUM_TOKEN_EXPIRATION
        fromService:
          type: web
          name: qcm-backend
          envVarKey: SANCTUM_TOKEN_EXPIRATION

databases:
  - name: qcm-database
    databaseName: qcm_app
    plan: basic-256mb
